name: H2H Tips

on:
  schedule:
    - cron: "30 6 * * *"    # 08:30 CEST — genereren (ochtend)
    # promo: niet op het hele uur (GitHub laat die runs vaak vallen, sinds 6 okt geen promo meer).
    # Meerdere kansen; promo.py post alleen tussen 09:00 en 10:59 lokaal en max. 1x per dag.
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "17 8 * * *"
    - cron: "47 8 * * *"
    - cron: "30 15 * * *"   # 17:30 CEST — genereren (eind middag)
    - cron: "13 * * * *"    # elk uur — eindstand + status afsluiten (+ opruimen)
  workflow_dispatch:

jobs:
  generate:
    # ochtend + eind middag, en bij handmatig starten
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *' || github.event.schedule == '30 15 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # nodig om state/tips.json terug te committen
    concurrency: { group: tips, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Genereer tips (komende dagen, verse odds)
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        # Zet repo-variabele PUBLISH=true om live te gaan (anders concept).
        run: python generate.py --days 4 ${{ vars.PUBLISH == 'true' && '--publish' || '' }}
      - name: Commit state
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/tips.json || true
          git commit -m "state: tips $(date -u +%F_%H%M)" || echo "geen wijzigingen"
          git pull --rebase --autostash || true
          git push || echo "niets te pushen"

  promo:
    # dagelijks 's ochtends een teaser + template-afbeelding naar Telegram.
    # Vuurt 4x tussen 07:17 en 08:47 UTC; promo.py post 1x tussen 09:00 en 10:59 lokaal (DST-proof).
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["17 7 * * *","47 7 * * *","17 8 * * *","47 8 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # om state/promo.json terug te committen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Post dagelijkse promo
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          # bij een cron-run zelf de lokale 09:00-check doen; dispatch post altijd
          PROMO_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python promo.py
      - name: Commit promo-state
        run: |
          git config user.name "tips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/promo.json || true
          git commit -m "state: promo $(date -u +%F)" || echo "geen wijzigingen"
          git pull --rebase --autostash || true
          git push || echo "niets te pushen"

  settle:
    # elk uur (resultaat snel bijgewerkt), en bij handmatig starten
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '13 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Sluit afgelopen tips af (eindstand + status)
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: python settle.py
